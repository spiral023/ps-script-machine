name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (PowerShell ${{ matrix.powershell-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        powershell-version: ['7.4.7', '7.5.0']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install PowerShell ${{ matrix.powershell-version }}
        shell: pwsh
        run: |
          # PowerShell 7 is pre-installed on windows-latest, but we verify the version
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion -lt '7.4') {
            Write-Error "PowerShell version must be 7.4 or newer"
            exit 1
          }

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -AllowClobber -SkipPublisherCheck

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber -SkipPublisherCheck

      - name: Run build (all quality gates)
        shell: pwsh
        run: |
          # Invoke-Build.ps1 is the single source of truth for the build/QA
          # process. It runs manifest validation, PSScriptAnalyzer, Pester
          # tests with coverage, documentation checks, the secret scan,
          # agent compliance, and the module build - identically to a local
          # run. CI must not re-implement any of this logic separately, or
          # local and CI results can silently drift apart.
          .\scripts\Invoke-Build.ps1 -CI -ErrorAction Stop

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: test-results-ps${{ matrix.powershell-version }}
          path: build/output/
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: coverage-report-ps${{ matrix.powershell-version }}
          path: build/output/coverage.xml
          if-no-files-found: warn

      - name: Upload module artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ps-script-machine-ps${{ matrix.powershell-version }}
          path: build/output/ps-script-machine/
          if-no-files-found: error